:root {
  --bg: #2a0a17;
  --text: #fff4ee;
  --muted: #f2c4cf;
  --gold: #d9b26a;
  --rose: #e8738f;
  --wine: #6e1430;
  --paper: #fff7f2;
  --paper-ink: #4a0f24;
  --overlay: linear-gradient(180deg, rgba(42,10,23,.72), rgba(42,10,23,.9));

}

    --bg: #fbe6ea; --text: #4a0f24; --muted: #8a3b52;
    --overlay: linear-gradient(180deg, rgba(251,230,234,.78), rgba(251,230,234,.92));
    --glow: rgba(255,255,255,.7); color-scheme: light;
  }
}
:root[data-theme="dark"] { --bg: #2a0a17; --text: #fff4ee; --muted: #f2c4cf; --overlay: linear-gradient(180deg, rgba(42,10,23,.72), rgba(42,10,23,.9)); --glow: rgba(0,0,0,.45); }

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--serif); font-size: 1.2rem; line-height: 1.6; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 8px; }

#veil { position: fixed; inset: 0; z-index: -1; background: var(--overlay); }

.petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.petals span { position: absolute; bottom: -40px; color: var(--rose); opacity: 0; animation: float linear infinite; }
@keyframes float {
  0% { transform: translate(0, 0) rotate(0); opacity: 0; }
  10% { opacity: .55; }
  50% { transform: translate(30px, -55vh) rotate(25deg); }
  90% { opacity: .4; }
  100% { transform: translate(-20px, -110vh) rotate(-15deg); opacity: 0; }
}

main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }

/* Hero */
.hero { text-align: center; padding: 3.5rem 0 2rem; }
.portrait {
  position: relative; width: min(64vw, 260px); aspect-ratio: 1; margin: 0 auto 2rem;
  animation: arrive 1.4s cubic-bezier(.2,.8,.2,1) both;
}
.portrait::before {
  content: ""; position: absolute; inset: -7px; border-radius: 50%;
  background: conic-gradient(#e8738f, #f6c9d3, #d9b26a, #c94f6d, #ff9fb5, #e8738f);
  filter: drop-shadow(0 0 18px rgba(232,115,143,.55)); animation: spin 9s linear infinite;
}
.portrait::after {
  content: ""; position: absolute; inset: -22px; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(232,115,143,.35), transparent 68%);
  animation: breathe 3.5s ease-in-out infinite alternate;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { from { transform: scale(.94); opacity: .7; } to { transform: scale(1.06); opacity: 1; } }
.ph { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 5px solid var(--bg); box-shadow: 0 20px 50px var(--glow); }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; filter: saturate(.95) sepia(.08); }
.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(110,20,48,.3)); pointer-events: none; }
.badge {
  position: absolute; right: 4%; bottom: 4%; width: 22%; aspect-ratio: 1; border-radius: 50%; z-index: 2;
  display: grid; place-items: center; font-size: clamp(1.1rem, 5vw, 1.6rem); color: #fff4ee;
  background: linear-gradient(145deg, #ff8fa8, #c94f6d); border: 4px solid var(--bg);
  box-shadow: 0 6px 16px rgba(201,79,109,.5); animation: beat 1.6s ease-in-out infinite;
}
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
@keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
h1 { margin: 0; font-weight: 400; line-height: 1.05; text-shadow: 0 2px 18px var(--glow); }
h1 .l1 { display: block; font-family: var(--script); font-size: clamp(3rem, 13vw, 5.6rem); color: var(--gold); }
h1 .l2 { display: block; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: clamp(1.9rem, 7vw, 3.1rem); margin-top: .35rem; }
.sub { font-style: italic; color: var(--muted); font-size: clamp(1.2rem, 4.2vw, 1.5rem); margin: .9rem auto 0; max-width: 30ch; }
.cake { width: min(220px, 60vw); margin: 2rem auto 0; }
.cake svg { width: 100%; height: auto; display: block; overflow: visible; }
.flame { transform-origin: center bottom; transform-box: fill-box; animation: flick .9s ease-in-out infinite alternate; }
.flame:nth-of-type(2) { animation-delay: .3s; } .flame:nth-of-type(3) { animation-delay: .6s; }
@keyframes flick { from { transform: scale(1) rotate(-3deg); } to { transform: scale(.86, 1.12) rotate(3deg); } }
.glowc { opacity: .55; animation: pulse 1.8s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
.out .flame, .out .glowc { animation: none; opacity: 0; transition: opacity .4s; }
.smoke { opacity: 0; }
.out .smoke { animation: rise 1.8s ease-out forwards; }
@keyframes rise { 0% { opacity: .45; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-24px); } }

.btn {
  border: 0; border-radius: 999px; padding: .75rem 1.7rem; font-size: 1.2rem; font-weight: 600; letter-spacing: .01em;
  background: linear-gradient(180deg, #ecd19a, var(--gold)); color: var(--paper-ink);
  box-shadow: 0 6px 22px rgba(217,178,106,.35); transition: transform .15s;
}
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--gold); }
.wish { margin-top: 1.5rem; }

/* Letters */
#letters { padding: 1.5rem 0 3rem; }
#letters[hidden] { display: none; }
#letters.enter .grid { animation: arrive 1s cubic-bezier(.2,.8,.2,1) both; }
.head { text-align: center; margin-bottom: 2.25rem; }
.head h2 { margin: 0; font-family: var(--script); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.6rem); color: var(--gold); line-height: 1.1; text-shadow: 0 2px 16px var(--glow); }
.progress { margin: .4rem 0 0; color: var(--muted); font-style: italic; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2.25rem 1rem; justify-items: center; }
@media (min-width: 680px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 679px) { .letter:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.letter { background: none; border: 0; padding: .3rem; display: grid; justify-items: center; gap: .8rem; }
.letter:nth-child(5n+1) { --e: #e8738f; } .letter:nth-child(5n+2) { --e: #c94f6d; }
.letter:nth-child(5n+3) { --e: #f0a5b6; } .letter:nth-child(5n+4) { --e: #b23a5b; }
.letter:nth-child(5n+5) { --e: #dba0ad; }
.env { position: relative; width: min(40vw, 175px); aspect-ratio: 1.45; perspective: 600px; transition: transform .25s; }
.letter:hover .env, .letter:focus-visible .env { transform: translateY(-6px) rotate(-1.5deg); }
.env > * { position: absolute; }
.back { inset: 0; background: var(--e); border-radius: 6px; filter: brightness(.78); box-shadow: 0 12px 28px rgba(0,0,0,.3); }
.paper { left: 8%; right: 8%; top: 8%; bottom: 8%; background: var(--paper); border-radius: 3px; z-index: 1; transition: transform .6s .25s cubic-bezier(.3,1.3,.5,1);
  background-image: repeating-linear-gradient(180deg, transparent 0 9px, rgba(110,20,48,.12) 9px 10px); }
.front { inset: 0; background: var(--e); border-radius: 6px; z-index: 2; clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%); }
.flap { left: 0; right: 0; top: 0; height: 58%; background: var(--e); filter: brightness(.9); z-index: 3; clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center; transition: transform .55s ease, z-index 0s .3s; }
.seal { left: 50%; top: 52%; width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 4; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #c8405f, #7a1430 75%); box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.12);
  display: grid; place-items: center; color: #f7d9a0; font-size: clamp(.9rem, 3vw, 1.2rem); transition: opacity .3s, transform .3s; }
.letter.open .flap { transform: rotateX(180deg); z-index: 0; }
.letter.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
.letter.open .paper { transform: translateY(-38%); }
.letter .label { font-style: italic; font-size: 1.15rem; color: var(--muted); max-width: 16ch; text-align: center; line-height: 1.3; }
.letter.open .label { color: var(--text); }

.finale { text-align: center; padding: 3rem 1rem 0; }
.finale[hidden] { display: none; }
.finale h2 { margin: 0; font-family: var(--script); font-weight: 400; font-size: clamp(2.6rem, 10vw, 4rem); color: var(--gold); text-shadow: 0 2px 16px var(--glow); }
.finale p { font-style: italic; font-size: 1.35rem; color: var(--muted); margin: .5rem auto 1.5rem; }

footer { position: relative; z-index: 1; text-align: center; padding: 1rem 0 3rem; }

/* Letter reading */
dialog { border: 0; padding: 0; background: transparent; max-width: min(540px, 92vw); width: 100%; color: var(--paper-ink); }
dialog::backdrop { background: rgba(30,6,15,.72); backdrop-filter: blur(3px); }
.sheet {
  position: relative; background: var(--paper); border-radius: 6px; padding: 2.25rem 1.75rem 1.5rem;
  box-shadow: 0 30px 80px rgba(0,0,0,.45); animation: unfold .5s cubic-bezier(.2,.9,.3,1.1);
  background-image: radial-gradient(circle at 100% 0, rgba(232,115,143,.14), transparent 45%), radial-gradient(circle at 0 100%, rgba(217,178,106,.16), transparent 45%);
  border: 1px solid rgba(217,178,106,.5);
}
@keyframes unfold { from { opacity: 0; transform: translateY(30px) rotateX(18deg); } to { opacity: 1; transform: none; } }
.sheet h2 { margin: 0 0 .75rem; font-family: var(--script); font-weight: 400; font-size: clamp(2rem, 7vw, 2.6rem); color: #9e2445; line-height: 1.15; }
.sheet .msg { margin: 0 0 1.5rem; font-size: clamp(1.25rem, 4.3vw, 1.45rem); line-height: 1.6; white-space: pre-wrap; }
.sheet .row { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: flex-end; }
.sheet .btn { background: #7a1430; color: var(--paper); box-shadow: none; font-size: 1.1rem; }
.sheet .btn.ghost { background: transparent; color: #7a1430; box-shadow: inset 0 0 0 1.5px #7a1430; }

.sound { position: fixed; top: 0; right: 0; z-index: 60; background: none; border: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px; }

<script>

  /* Sound */
  var AC = null, muted = false;

    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    g.gain.exponentialRampToValueAtTime(0.5, t + 0.12);

    opened = {};
    $("name").textContent = cfg.n;
    $("sub").textContent = cfg.s;
    $("cake").classList.remove("out");
    $("blow").hidden = false;
    $("letters").hidden = true;
    $("letters").classList.remove("enter");
    $("finale").hidden = true;
    var grid = $("grid"); grid.textContent = "";
    cfg.m.forEach(function (g, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "letter";
      b.setAttribute("aria-label", "Open letter: " + g.t);
      b.innerHTML = '<span class="env"><span class="back"></span><span class="paper"></span><span class="front"></span><span class="flap"></span><span class="seal">♥</span></span><span class="label"></span>';
      b.querySelector(".label").textContent = g.t;
      b.addEventListener("click", function () { openLetter(i, b); });
      grid.appendChild(b);
    });
    progress();
  }
  function progress() {
    var n = Object.keys(opened).length, t = cfg.m.length;
    $("progress").textContent = n === 0 ? t + " letters, open them in any order" : n + " of " + t + " opened";
  }

  $("blow").addEventListener("click", function () {
    $("cake").classList.add("out");
    $("blow").hidden = true;
    sBlow();
    setTimeout(function () { sCelebrate(0); }, 700);
    burst(innerWidth / 2, innerHeight * 0.12, 110);
    setTimeout(function () {
      $("letters").hidden = false;
      $("letters").classList.add("enter");
      $("letters").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }, 1100);
  });

  var dlg = $("msg");
  function openLetter(i, btn) {
    var g = cfg.m[i];
    lastOpener = btn;
    btn.classList.add("open");
    opened[i] = true; progress();
    sRustle(); sSparkle(0.15);
    var r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 3, 34);
    setTimeout(function () {
      $("msg-title").textContent = g.t;
      $("msg-text").textContent = g.x;
      var done = Object.keys(opened).length === cfg.m.length;
      $("msg-next").hidden = done;
      $("msg-close").textContent = done ? "Close" : "Back to letters";
      if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    }, reduce ? 0 : 650);
  }
  function closeMsg() {
    if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
    if (Object.keys(opened).length === cfg.m.length) {
      $("finale").hidden = false;
      $("finale").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
      burst(innerWidth / 2, innerHeight / 3, 150);
      sCelebrate(0.2);
    } else if (lastOpener) lastOpener.focus();
  }
  $("msg-close").addEventListener("click", closeMsg);
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeMsg(); });
  dlg.addEventListener("cancel", function (e) { e.preventDefault(); closeMsg(); });
  $("msg-next").addEventListener("click", function () {
    var g = $("grid").children;
    for (var i = 0; i < g.length; i++) {
      if (!opened[i]) {
        if (dlg.close) dlg.close();
        g[i].scrollIntoView({ block: "center" });
        (function (el, idx) { setTimeout(function () { openLetter(idx, el); }, 200); })(g[i], i);
        return;
      }
    }
  });
  $("again").addEventListener("click", function () { burst(innerWidth / 2, innerHeight * 0.55, 180); sCelebrate(0); });
  $("restart").addEventListener("click", function () { render(); window.scrollTo(0, 0); });

  /* Hearts and petals burst */
  var cv = $("confetti"), ctx = cv.getContext("2d"), parts = [], running = false;
  var pal = ["#e8738f", "#c94f6d", "#f6c9d3", "#d9b26a", "#fff4ee", "#b23a5b"];
  function size() { var d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", size); size();
  function heart(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * .2);
    ctx.bezierCurveTo(0, -s * .5, -s * .5, -s * .5, -s * .5, -s * .2);
    ctx.bezierCurveTo(-s * .5, s * .1, 0, s * .3, 0, s * .5);
    ctx.bezierCurveTo(0, s * .3, s * .5, s * .1, s * .5, -s * .2);
    ctx.bezierCurveTo(s * .5, -s * .5, 0, -s * .5, 0, -s * .2);
    ctx.fill();
  }
  function burst(x, y, n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, s: 8 + Math.random() * 12,
        r: Math.random() * 6, vr: (Math.random() - .5) * .12, c: pal[(Math.random() * pal.length) | 0],
        k: Math.random() < .6 ? "h" : "p", life: 0, sway: Math.random() * 6 });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.y < innerHeight + 40 && p.life < 260; });
    parts.forEach(function (p) {
      p.vy += 0.09; p.vx *= 0.98; p.vy *= 0.99;
      p.x += p.vx + Math.sin((p.life + p.sway * 10) / 14) * .6; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - p.life / 260); ctx.fillStyle = p.c;
      if (p.k === "h") heart(p.s);
      else { ctx.beginPath(); ctx.ellipse(0, 0, p.s * .45, p.s * .22, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    if (parts.length) requestAnimationFrame(tick); else running = false;
  }

  render();
})();
</script>
</body>
</html>
