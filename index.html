<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b1f3b;
  --bg-2: #252a4d;
  --text: #fff8ee;
  --muted: #b9bcd6;
  --paper: #fff8ee;
  --paper-ink: #1b1f3b;
  --c1: #ff7a3d; --c2: #ff8fb1; --c3: #6fd3b0; --c4: #ffd65c; --c5: #8fb4ff; --c6: #c9a3ff;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1f3b; } }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fff1dc; --bg-2: #ffe6c2; --text: #1b1f3b; --muted: #54587a;
    --paper: #fffaf2; --paper-ink: #1b1f3b; color-scheme: light;
  }
}
:root[data-theme="dark"] { --bg:#1b1f3b; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--body); font-size: 1.05rem; line-height: 1.55;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 5;
}
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1; margin: 0; letter-spacing: -0.02em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--c4); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 1.25rem; }

/* Hero */
.hero { text-align: center; padding: 3.5rem 0 2.5rem; }
.hero h1 { font-size: clamp(2.5rem, 10vw, 5.75rem); }
.hero p.sub { color: var(--muted); max-width: 30ch; margin: 1rem auto 0; }
.cake-wrap { margin: 1.5rem auto 0; width: min(300px, 78vw); }
.cake-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.flame { transform-origin: center bottom; transform-box: fill-box; animation: flick 0.9s ease-in-out infinite alternate; }
.flame:nth-of-type(2) { animation-delay: .25s; } .flame:nth-of-type(3) { animation-delay: .5s; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.88, 1.12) rotate(3deg); } }
.out .flame { animation: none; opacity: 0; transform: scale(.2); transition: opacity .35s, transform .35s; }
.smoke { opacity: 0; }
.out .smoke { animation: rise 1.6s ease-out forwards; }
@keyframes rise { 0% { opacity: .8; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-34px); } }
.btn {
  background: var(--c4); color: var(--paper-ink); border: 0; border-radius: 999px;
  padding: .85rem 1.6rem; font-weight: 500; font-size: 1.05rem;
  box-shadow: 0 4px 0 rgba(0,0,0,.28); transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--muted); }
.wish { margin-top: 1.5rem; }

/* Gifts */
#gifts { padding: 1rem 0 3rem; }
#gifts[hidden] { display: none; }
#gifts.enter .grid { animation: drop .7s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes drop { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
.gifts-head { text-align: center; margin-bottom: 2rem; }
.gifts-head h2 { font-size: clamp(1.8rem, 6vw, 3rem); }
.progress { color: var(--muted); margin-top: .6rem; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.75rem 1rem; justify-items: center; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.gift { background: none; border: 0; padding: .25rem; display: grid; justify-items: center; gap: .6rem; }
.gift:nth-child(6n+1) { --c: var(--c1); } .gift:nth-child(6n+2) { --c: var(--c2); }
.gift:nth-child(6n+3) { --c: var(--c3); } .gift:nth-child(6n+4) { --c: var(--c4); }
.gift:nth-child(6n+5) { --c: var(--c5); } .gift:nth-child(6n+6) { --c: var(--c6); }
.pack { position: relative; width: min(36vw, 150px); aspect-ratio: 1; transform: rotate(-2deg); transition: transform .2s; }
.gift:nth-child(even) .pack { transform: rotate(2deg); }
.gift:hover .pack, .gift:focus-visible .pack { transform: translateY(-6px) rotate(0); }
.base { position: absolute; left: 7%; right: 7%; top: 34%; bottom: 0; background: var(--c); border-radius: 6px 6px 10px 10px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.12); }
.lid { position: absolute; left: 0; right: 0; top: 16%; height: 22%; background: var(--c); border-radius: 8px; filter: brightness(1.08);
  box-shadow: 0 3px 0 rgba(0,0,0,.15); transition: transform .5s cubic-bezier(.3,1.5,.5,1); transform-origin: left bottom; }
.base::after, .lid::after { content: ""; position: absolute; top: 0; bottom: 0; left: 43%; width: 14%; background: rgba(255,248,238,.85); }
.bow { position: absolute; left: 50%; top: 2%; width: 34%; height: 18%; transform: translateX(-50%); transition: transform .5s, opacity .3s; }
.bow::before, .bow::after { content: ""; position: absolute; top: 0; width: 52%; height: 100%; border: 5px solid rgba(255,248,238,.9); border-radius: 60% 60% 60% 10%; }
.bow::before { left: 0; transform: rotate(-12deg); } .bow::after { right: 0; transform: scaleX(-1) rotate(-12deg); }
.gift.open .lid { transform: translate(14%, -70%) rotate(22deg); }
.gift.open .bow { transform: translate(40%, -220%) rotate(30deg); opacity: .0; }
.gift.open .base::before { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 2rem; font-weight: 800; color: var(--paper-ink); z-index: 1; }
.gift .label { font-family: var(--display); font-weight: 500; font-size: 1.05rem; color: var(--muted); max-width: 16ch; }
.gift.open .label { color: var(--text); }

.finale { text-align: center; padding: 2.5rem 1rem 0; }
.finale[hidden] { display: none; }
.finale h2 { font-size: clamp(1.8rem, 6vw, 3rem); margin-bottom: .75rem; }
.finale p { color: var(--muted); margin: 0 auto 1.25rem; max-width: 34ch; }

footer { text-align: center; padding: 1rem 0 3rem; }
footer .link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; font-size: .95rem; }

/* Dialogs */
dialog { border: 0; padding: 0; background: transparent; max-width: min(520px, 92vw); width: 100%; color: var(--paper-ink); }
dialog::backdrop { background: rgba(10, 12, 30, .7); }
.card { background: var(--c, var(--c4)); border-radius: 18px; padding: 1.75rem 1.5rem 1.5rem; box-shadow: 0 10px 0 rgba(0,0,0,.2); animation: pop .35s cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { from { transform: scale(.85) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
.card h2 { font-size: clamp(1.5rem, 5vw, 2.1rem); margin-bottom: .9rem; }
.card .msg { font-size: 1.2rem; line-height: 1.5; margin: 0 0 1.5rem; white-space: pre-wrap; }
.card .row { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: flex-end; }
.card .btn { background: var(--paper-ink); color: var(--paper); box-shadow: none; }
.card .btn.ghost { background: transparent; color: var(--paper-ink); box-shadow: inset 0 0 0 2px var(--paper-ink); }
.editor { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 1.5rem; max-height: 88vh; overflow-y: auto; box-shadow: 0 10px 0 rgba(0,0,0,.2); }
.editor h2 { font-size: 1.7rem; margin-bottom: .4rem; }
.editor p { margin: 0 0 1rem; font-size: .95rem; }
.editor label { display: block; font-weight: 500; margin: .9rem 0 .3rem; }
.editor input, .editor textarea { width: 100%; font: inherit; color: var(--paper-ink); background: #fff; border: 2px solid #1b1f3b33; border-radius: 10px; padding: .6rem .7rem; }
.editor textarea { min-height: 190px; resize: vertical; }
.editor .hint { font-size: .85rem; opacity: .75; margin-top: .3rem; }
.editor .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.25rem; }
.editor .btn { background: var(--paper-ink); color: var(--paper); box-shadow: none; }
.editor .btn.ghost { background: transparent; color: var(--paper-ink); box-shadow: inset 0 0 0 2px var(--paper-ink); }
.linkout { margin-top: 1rem; }
.linkout[hidden] { display: none; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="wrap">
  <section class="hero" id="hero">
    <h1 id="title">Happy birthday</h1>
    <p class="sub" id="sub">Before the presents, make a wish.</p>
    <div class="cake-wrap" id="cake">
      <svg viewBox="0 0 240 230" role="img" aria-label="A birthday cake with three lit candles">
        <ellipse cx="120" cy="214" rx="112" ry="12" fill="#000" opacity=".22"/>
        <rect x="22" y="150" width="196" height="60" rx="10" fill="#ff8fb1"/>
        <path d="M22 160 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 q14 18 28 0 v-10 h-196z" fill="#fff8ee"/>
        <rect x="52" y="104" width="136" height="50" rx="9" fill="#ffd65c"/>
        <path d="M52 112 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 22 0 q11 16 24 0 v-8 h-136z" fill="#ff7a3d"/>
        <g>
          <rect x="80" y="66" width="10" height="40" rx="3" fill="#6fd3b0"/>
          <rect x="115" y="62" width="10" height="44" rx="3" fill="#8fb4ff"/>
          <rect x="150" y="66" width="10" height="40" rx="3" fill="#c9a3ff"/>
          <path class="flame" d="M85 40 q-9 13 0 22 q9 -9 0 -22z" fill="#ffd65c"/>
          <path class="flame" d="M120 36 q-9 13 0 22 q9 -9 0 -22z" fill="#ffd65c"/>
          <path class="flame" d="M155 40 q-9 13 0 22 q9 -9 0 -22z" fill="#ffd65c"/>
          <path class="smoke" d="M85 58 q-6 -10 0 -18 q6 -8 0 -16" stroke="#b9bcd6" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="smoke" d="M120 54 q-6 -10 0 -18 q6 -8 0 -16" stroke="#b9bcd6" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="smoke" d="M155 58 q-6 -10 0 -18 q6 -8 0 -16" stroke="#b9bcd6" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="wish"><button class="btn" id="blow" type="button">Blow out the candles</button></div>
  </section>

  <section id="gifts" hidden aria-labelledby="gifts-title">
    <div class="gifts-head">
      <h2 id="gifts-title">Now the presents</h2>
      <p class="progress" id="progress" aria-live="polite"></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="finale" id="finale" hidden>
      <h2 id="finale-title">That’s every one</h2>
      <p id="finale-text"></p>
      <button class="btn" id="again" type="button">Celebrate again</button>
    </div>
  </section>
</main>

<footer>
  <button class="link" id="make" type="button">Make one for someone you love</button>
</footer>

<dialog id="msg" aria-labelledby="msg-title">
  <div class="card" id="card">
    <h2 id="msg-title"></h2>
    <p class="msg" id="msg-text"></p>
    <div class="row">
      <button class="btn ghost" id="msg-close" type="button">Close</button>
      <button class="btn" id="msg-next" type="button">Open the next one</button>
    </div>
  </div>
</dialog>

<dialog id="editor" aria-labelledby="ed-title">
  <div class="editor">
    <h2 id="ed-title">Make your own surprise</h2>
    <p>Write the messages, preview the page, then copy the link and send it.</p>
    <label for="ed-to">Who is it for?</label>
    <input id="ed-to" maxlength="40" autocomplete="off">
    <label for="ed-from">Who is it from?</label>
    <input id="ed-from" maxlength="40" autocomplete="off">
    <label for="ed-msgs">Gifts, one per line</label>
    <textarea id="ed-msgs" spellcheck="true"></textarea>
    <div class="hint">Format: Title | Message. Up to 12 gifts. Keep messages short so the link stays short.</div>
    <div class="row">
      <button class="btn" id="ed-preview" type="button">Preview</button>
      <button class="btn" id="ed-link" type="button">Create link</button>
      <button class="btn ghost" id="ed-close" type="button">Close</button>
    </div>
    <div class="linkout" id="linkout" hidden>
      <label for="ed-url">Your link</label>
      <input id="ed-url" readonly>
      <div class="row"><button class="btn" id="ed-copy" type="button">Copy link</button></div>
      <div class="hint" id="ed-note"></div>
    </div>
  </div>
</dialog>

<script>
(function () {
  var DEFAULT = {
    n: "Maya", f: "Sam",
    m: [
      { t: "Open me first", x: "Another year, and you still make everyone around you feel like the party already started. I’m so glad you’re mine." },
      { t: "A small confession", x: "I pretended to hate your terrible playlist for years. I now know every song. Please never delete it." },
      { t: "One free favorite dinner", x: "Redeemable any night this year. You pick the place, I pay, and nobody is allowed to say “I’m not that hungry.”" },
      { t: "Remember when", x: "We got lost on the way to the lake and found the best view of the whole trip. That’s how every adventure with you goes." },
      { t: "A wish for you", x: "More slow mornings, more loud laughs, and a year that surprises you in all the right ways." },
      { t: "The last one", x: "Look up from this screen. Someone is waiting to hug you. Go find them." }
    ]
  };
  var cfg = DEFAULT;
  var opened = {};
  var lastOpener = null;

  var $ = function (id) { return document.getElementById(id); };

  function enc(o) {
    var b = new TextEncoder().encode(JSON.stringify(o)), s = "";
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function dec(t) {
    t = t.replace(/-/g, "+").replace(/_/g, "/");
    while (t.length % 4) t += "=";
    var s = atob(t), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(a));
  }
  function valid(o) {
    return o && typeof o.n === "string" && Array.isArray(o.m) && o.m.length > 0 && o.m.length <= 12 &&
      o.m.every(function (g) { return g && typeof g.t === "string" && typeof g.x === "string"; });
  }
  function fromHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return DEFAULT;
    try { var o = dec(h); if (valid(o)) { o.f = typeof o.f === "string" ? o.f : ""; return o; } } catch (e) {}
    return DEFAULT;
  }

  /* Render */
  function render() {
    opened = {};
    document.title = "A birthday surprise for " + cfg.n;
    $("title").textContent = "Happy birthday, " + cfg.n;
    $("sub").textContent = "Before the presents, make a wish.";
    $("cake").classList.remove("out");
    $("hero").hidden = false;
    $("blow").hidden = false;
    $("blow").disabled = false;
    $("gifts").hidden = true;
    $("gifts").classList.remove("enter");
    $("finale").hidden = true;
    var grid = $("grid");
    grid.textContent = "";
    cfg.m.forEach(function (g, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "gift"; b.dataset.i = i;
      b.setAttribute("aria-label", "Open gift: " + g.t);
      b.innerHTML = '<span class="pack"><span class="base"></span><span class="lid"></span><span class="bow"></span></span><span class="label"></span>';
      b.querySelector(".label").textContent = g.t;
      b.addEventListener("click", function () { openGift(i, b); });
      grid.appendChild(b);
    });
    $("finale-title").textContent = "That’s every one";
    $("finale-text").textContent = cfg.f ? "With love, from " + cfg.f + "." : "Happy birthday.";
    updateProgress();
  }
  function updateProgress() {
    var n = Object.keys(opened).length, t = cfg.m.length;
    $("progress").textContent = n === 0
      ? t + " gifts. Open them in any order."
      : n + " of " + t + " opened";
  }

  /* Candles */
  $("blow").addEventListener("click", function () {
    $("cake").classList.add("out");
    $("blow").hidden = true;
    $("sub").textContent = "Wish made. Now for the good part.";
    var r = $("cake").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.3, 120);
    setTimeout(function () {
      $("gifts").hidden = false;
      $("gifts").classList.add("enter");
      $("gifts").scrollIntoView({ behavior: "smooth", block: "start" });
    }, 900);
  });

  /* Gifts */
  var dlg = $("msg");
  var colors = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  function openGift(i, btn) {
    var g = cfg.m[i];
    lastOpener = btn;
    btn.classList.add("open");
    opened[i] = true;
    updateProgress();
    $("msg-title").textContent = g.t;
    $("msg-text").textContent = g.x;
    $("card").style.setProperty("--c", "var(" + colors[i % 6] + ")");
    var done = Object.keys(opened).length === cfg.m.length;
    $("msg-next").hidden = done;
    $("msg-close").textContent = done ? "Close" : "Back to gifts";
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    var r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 3, 50);
  }
  function closeMsg() {
    if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
    var done = Object.keys(opened).length === cfg.m.length;
    if (done) {
      $("finale").hidden = false;
      $("finale").scrollIntoView({ behavior: "smooth", block: "center" });
      burst(window.innerWidth / 2, window.innerHeight / 3, 160);
    } else if (lastOpener) lastOpener.focus();
  }
  $("msg-close").addEventListener("click", closeMsg);
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeMsg(); });
  $("msg-next").addEventListener("click", function () {
    var g = $("grid").children;
    for (var i = 0; i < g.length; i++) {
      if (!opened[i]) {
        if (dlg.close) dlg.close();
        g[i].scrollIntoView({ block: "center" });
        setTimeout(function (el, idx) { return function () { openGift(idx, el); }; }(g[i], i), 150);
        return;
      }
    }
  });
  $("again").addEventListener("click", function () {
    burst(window.innerWidth / 2, window.innerHeight * 0.6, 200);
  });

  /* Editor */
  var ed = $("editor");
  function fillEditor() {
    $("ed-to").value = cfg.n;
    $("ed-from").value = cfg.f || "";
    $("ed-msgs").value = cfg.m.map(function (g) { return g.t + " | " + g.x; }).join("\n");
    $("linkout").hidden = true;
  }
  function readEditor() {
    var m = $("ed-msgs").value.split("\n").map(function (l) { return l.trim(); }).filter(Boolean).slice(0, 12).map(function (l) {
      var k = l.indexOf("|");
      if (k < 0) return { t: "A surprise", x: l };
      return { t: l.slice(0, k).trim() || "A surprise", x: l.slice(k + 1).trim() };
    }).filter(function (g) { return g.x; });
    return { n: $("ed-to").value.trim() || "you", f: $("ed-from").value.trim(), m: m };
  }
  $("make").addEventListener("click", function () { fillEditor(); ed.showModal(); });
  $("ed-close").addEventListener("click", function () { ed.close(); });
  $("ed-preview").addEventListener("click", function () {
    var o = readEditor();
    if (!valid(o)) { $("ed-msgs").focus(); return; }
    cfg = o; ed.close(); render(); window.scrollTo(0, 0);
  });
  $("ed-link").addEventListener("click", function () {
    var o = readEditor();
    if (!valid(o)) { $("ed-msgs").focus(); return; }
    var token = enc(o);
    var base = location.href.split("#")[0];
    $("ed-url").value = base + "#" + token;
    $("ed-note").textContent = "If the start of this link looks wrong, copy only the part from # onward and add it to the end of this page’s address.";
    $("linkout").hidden = false;
    $("ed-url").select();
  });
  $("ed-copy").addEventListener("click", function () {
    var f = $("ed-url"); f.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(f.value);
      else document.execCommand("copy");
      $("ed-copy").textContent = "Copied";
    } catch (e) { $("ed-copy").textContent = "Press Ctrl+C to copy"; }
    setTimeout(function () { $("ed-copy").textContent = "Copy link"; }, 1800);
  });

  /* Confetti */
  var cv = $("confetti"), ctx = cv.getContext("2d"), parts = [], running = false;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pal = ["#ff7a3d", "#ff8fb1", "#6fd3b0", "#ffd65c", "#8fb4ff", "#c9a3ff", "#fff8ee"];
  function size() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", size); size();
  function burst(x, y, n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pal[(Math.random() * pal.length) | 0], life: 0 });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.y < innerHeight + 30 && p.life < 220; });
    parts.forEach(function (p) {
      p.vy += 0.22; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - p.life / 220);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (parts.length) requestAnimationFrame(tick); else running = false;
  }

  addEventListener("hashchange", function () { cfg = fromHash(); render(); });
  cfg = fromHash();
  render();
})();
</script>
</body>
</html>
